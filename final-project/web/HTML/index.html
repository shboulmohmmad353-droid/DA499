<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FractureVision V2 | AI Diagnostics</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=IBM+Plex+Sans+Arabic:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanner-line"></div>
    
    <div class="container">
        <header>
            <div class="brand">
                <div class="pulse-icon"></div>
                <h1>Fracture<span>Vision</span> <small>V2.0</small></h1>
            </div>
            <p>نظام التشخيص العظمي المتقدم المدعوم بالذكاء الاصطناعي</p>
        </header>

        <div class="main-layout">
            <!-- جانب الرفع -->
            <section class="upload-area" id="drop-zone">
                <input type="file" id="file-input" hidden>
                <div class="upload-placeholder">
                    <div class="scan-frame"></div>
                    <i class="icon-plus">+</i>
                    <p>قم بسحب صورة الأشعة هنا</p>
                    <span>يدعم JPG, PNG (بحد أقصى 10MB)</span>
                </div>
                <div id="preview-wrapper" class="hidden">
                    <img id="image-preview" src="">
                    <button id="run-btn">بدء عملية التحليل الذكي</button>
                </div>
            </section>

            <!-- جانب النتائج -->
            <section class="results-area hidden" id="results">
                <div class="stats-panel">
                    <div class="stat-card">
                        <label>التصنيف</label>
                        <h2 id="res-status">--</h2>
                    </div>
                    <div class="stat-card">
                        <label>نسبة اليقين</label>
                        <h2 id="res-prob">0%</h2>
                    </div>
                </div>

                <div class="display-panel">
                    <div class="view-toggle">
                        <button class="active" data-view="image_bbox">تحديد الموقع (BBox)</button>
                        <button data-view="image_mask">التجزئة الدقيقة (Mask)</button>
                    </div>
                    <div class="image-host">
                        <img id="main-result" src="">
                        <div id="loading-overlay" class="hidden">
                            <div class="ai-loader"></div>
                            <p>جاري تحليل الأنماط العظمية...</p>
                        </div>
                    </div>
                </div>

                <button class="reset-btn" onclick="location.reload()">تحليل صورة جديدة</button>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
